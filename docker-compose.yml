services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: metis
      POSTGRES_USER: metis
      POSTGRES_PASSWORD: metis_local_password
    ports:
      - "5433:5432"
    volumes:
      - metis-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis -d metis"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/metis_graph_password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - metis-neo4j:/data

  ml-server:
    build:
      context: ./ml
    environment:
      DATABASE_URL: postgresql://metis:metis_local_password@postgres:5432/metis
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: metis_graph_password
      ML_ALLOW_HASH_FALLBACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    ports:
      - "8000:8000"

  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    restart: unless-stopped
    volumes:
      - ./ops/judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2360:2358"
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    restart: unless-stopped
    volumes:
      - ./ops/judge0/judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started

  judge0-db:
    image: postgres:16.2
    env_file:
      - ./ops/judge0/judge0.conf
    volumes:
      - judge0-postgres:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7.2.4
    command:
      [
        "bash",
        "-c",
        "docker-entrypoint.sh --appendonly no --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    env_file:
      - ./ops/judge0/judge0.conf

volumes:
  judge0-postgres:
  metis-neo4j:
  metis-postgres:
